name: Daily TW Quant Cloud Pipeline

on:
  schedule:
    # 05:45 UTC = 13:45 台湾时间 (周一至周五)
    - cron: '45 5 * * 1-5'
    # 06:15 UTC = 14:15 台湾时间 (周一至周五，二次验证)
    - cron: '15 6 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 网页端随时手动一键触发

concurrency:
  group: tw-quant-daily-pipeline
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  run-pipeline:
    name: Execute Daily TW Quant Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config --global user.name "Antigravity Quant Bot"
          git config --global user.email "bot@futienchun.com"

      - name: Execute Daily Rebalance & Dashboard Generation
        run: |
          python src/risk_dashboard.py --start 2024-01 --end $(date +%Y-%m) --offline-cache --model-portfolio --model-method multi-factor-shrink --ai-tilt moderate --market-source public-close --market-mode close --execute-simulated-trades

      - name: Run Metric Sync & QA Verification
        run: |
          python scripts/sync_all_metrics.py
          python scripts/run_local_qa_checks.py --skip-dashboard-fixture

      - name: Commit and Push Updated Data & Dashboard
        run: |
          git add dashboard/index.html data/ config/ scripts/
          if git diff --staged --quiet; then
            echo "No changes to commit. Dashboard is already up-to-date."
          else
            git commit -m "auto(cloud): daily quant rebalance & dashboard update [$(date +'%Y-%m-%d %H:%M')]"
            git pull --rebase origin main || true
            git push origin main
          fi
